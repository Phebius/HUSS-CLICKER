<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Hustle Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="title">YOU ARE HUSSING WHILE OTHERS ARE PARTYING.</h1>
    <h1 id="aura_point">aura point : <span id="nombre">0</span>; <span class="x">1</span> aura per huss</h1>
    <div class="placement_upgrades">
      <button class="hussing">HUSS ME</button>
      <div>
        <button class="upgrade">HUSS MORE (+<span id="upgrade1_x">1</span>)</button>
        <h2 class="upgrade1_price">COST : <span class="upgrade1_price_text">30</span> AURA POINT</h2>
      </div>
    </div>

    <div class="upgrade_placement2">
      <button class="upgrade2">AURA BOOM (multiplier : <span class="upgrade2_x">1</span>)</button>
      <h2 class="upgrade2_price">price : <span class="upgrade2_price_tag">1200</span></h2>
    </div>
      <h2 class="upgrade1_price">COST : <span class="upgrade1_price_text">30</span> AURA POINT</h2>
    </div>
    <script src="game.js"></script>
</body>
</html>
